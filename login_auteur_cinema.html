<!-- Cinematic Background -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-40" data-alt="Moody cinematic wide shot of an empty art-deco theater at night with subtle red rim lighting and deep atmospheric shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBBaJ9Kx3smr0fyWx7Dp1eslDqbYXhcS6VS7m8for2gg9xV_D_hL0DekuBRgFgZuEaxjh-xPsoq0sG6_AMyXdnk2nGuohoQnKcV2bZgFoqoDRND3mZ41kieiGQtAVPndPsS2BPihl29NJc65Z7V8ndEa2ZpTCcJTfFvEDBeY5lb8IBmU5zyTkdXLZeiJbH7yblzIunycKn_hqGzZWXYtoFAvI_O5j-LudhTR9CxYOJPWNlztm6KgBjADfI7kyfEbQggZq92dMRLQWo"/>

</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md px-6 py-12">
<!-- Header Section -->
<div class="mb-12 text-center">
<h1 class="font-headline font-black text-4xl tracking-tighter text-primary-container mb-2">AUTEUR</h1>
<p class="font-body text-on-surface-variant text-sm tracking-wide">Enter the Director’s Cut</p>
</div>
<!-- Glassmorphic Login Card -->
<section class="glass-card ghost-border rounded-3xl p-8 shadow-[0_24px_48px_rgba(0,0,0,0.6)]">
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label text-xs font-semibold text-on-surface-variant uppercase tracking-widest px-1">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">mail</span>
<input class="w-full bg-surface-container-high border-none rounded-2xl py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary-container/50 transition-all outline-none" placeholder="name@cinema.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label text-xs font-semibold text-on-surface-variant uppercase tracking-widest">Password</label>
<a class="text-xs font-medium text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">lock</span>
<input class="w-full bg-surface-container-high border-none rounded-2xl py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary-container/50 transition-all outline-none" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
                <button onclick="window.location.href='home_movie_booking.html'" class="w-full bg-gradient-to-br from-primary-container to-secondary-container text-on-primary-container font-headline font-bold py-4 rounded-2xl shadow-lg shadow-primary-container/20 hover:scale-[1.02] active:scale-95 transition-all duration-200 uppercase tracking-widest text-sm" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="flex items-center my-8">
<div class="flex-grow h-[1px] bg-surface-variant/30"></div>
<span class="mx-4 text-xs font-medium text-on-surface-variant/50 uppercase tracking-tighter">OR CONTINUE WITH</span>
<div class="flex-grow h-[1px] bg-surface-variant/30"></div>
</div>
<!-- Secondary Actions -->
<div class="space-y-4">
<button class="w-full glass-card ghost-border flex items-center justify-center gap-3 py-3.5 rounded-2xl hover:bg-surface-container-highest transition-colors group">
<img class="w-5 h-5 opacity-80 group-hover:opacity-100 transition-opacity" data-alt="Google G logo in standard brand colors for authentication service" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD_GkbJCKaAHaP_FWjG6qJeVrZ8pyMkU2pNVKYLvJa_w9x1oAreeKPHKN_uLzm8qYEcLCYQrkPxbnzUHDM0JnZOBeJsedhk0E22MUrMnmx6aimxXwkeZ36kGgI3hzYGYLmp9DAqmYRAX5Dzkp4XAo9ILU7L8Hb-7RuCQqr7IKw_KV2Q47UKR2l-QosW3aH4JhN-XMc7RiaXZt-JprAxCiJbJ4ZRk8Fvad6o_dBEAW7aZWNkmLVbye3zT9MB2Tqvjh2JcC5hYryuuyk"/>

<p class="mt-8 text-center font-body text-sm text-on-surface-variant">
            New to the theater? 
            <a class="text-primary font-bold ml-1 hover:underline underline-offset-4 decoration-2" href="#">Create an Account</a>
</p>

<div class="fixed bottom-8 right-8 z-20 hidden md:block">
<div class="flex flex-col items-end opacity-20">
<span class="font-headline font-extrabold text-6xl tracking-tighter text-on-surface">01</span>
<span class="font-label text-[10px] uppercase tracking-[0.4em] text-on-surface-variant -mt-2">Perspective</span>
